# The sitemend GitHub Action, as a site would use it.
#
# A ratchet: the action audits the pull request and its base branch, and fails the check
# only when the PR adds a measured critical or high finding the base did not have.
# Findings already on the base branch never fail a PR. Judgement calls are listed as
# advisory and never fail it. One PR comment quotes each finding's evidence and is
# updated on every push; the full report is attached to the run.
name: SEO check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # to post and update the comment

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      # Pinned, so a new release never changes what fails your build without a PR.
      # This site is plain HTML, so there is no build-command.
      - uses: SurendharVr/sitemend@v1.5.0
        with:
          site-dir: site
